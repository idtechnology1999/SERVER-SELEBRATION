name: Backend CI/CD
on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test

  # Image publishing removed: images are built and pushed by hand to
  # ghcr.io/kingselo/selebration-server (this repo can't publish there).
